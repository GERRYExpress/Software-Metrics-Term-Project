# sonar-project.properties
sonar.projectKey=KD5F-Frontend
sonar.projectName=KD5F Frontend
sonar.projectVersion=1.0

# Source directories
sonar.sources=frontend/src,backend
sonar.tests=frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.min.js,**/*.map

# Language-specific
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.go.coverage.reportPaths=backend/coverage.out

# Duplication detection excludes test files. Test suites intentionally repeat
# setup per case (cart vs wishlist, buyer vs seller layouts, per-view mounts);
# DRY-ing them would couple suites and hide fixture intent. Covers every file
# flagged in the Sonar "duplication on new code" list (all were *_test.go /
# tests/** files; src/ measures clean).
sonar.cpd.exclusions=backend/**/*_test.go,backend/*_test.go,frontend/tests/**