services:
  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: mymariadb
    volumes:
      - "mdata:/var/lib/mysql"
      - "./sql:/docker-entrypoint-initdb.d"
    ports:
      - "3000:3306"
  adminer:
    image: adminer
    restart: always
    ports:
      - "9000:8080"
  qg:
    image: sonarqube:latest
    ports:
      - "9001:9000"
  ngrok:
    image: ngrok/ngrok:latest
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    command:
      - "http"
      - "9001"
      - "--url"
      - "${NGROK_URL}"
volumes:
  mdata: